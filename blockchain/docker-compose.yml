version: '3.8'

services:
  signer1:
    image: ethereum/client-go:v1.13.5
    container_name: eth-signer1
    command:
      - "--datadir=/data"
      - "--networkid=1337"
      - "--port=30303"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=eth,net,web3,personal,admin,txpool,debug"
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - "--ws"
      - "--ws.addr=0.0.0.0"
      - "--ws.port=8546"
      - "--ws.api=eth,net,web3"
      - "--ws.origins=*"
      - "--mine"
      - "--miner.etherbase=0xc6BCfea104dBC7cB26CC990e33e58fEBd62fa533"
      - "--miner.recommit=500ms"
      - "--unlock=0xc6BCfea104dBC7cB26CC990e33e58fEBd62fa533"
      - "--password=/data/password.txt"
      - "--allow-insecure-unlock"
      - "--verbosity=3"
    volumes:
      - ./signer1:/data
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    networks:
      - eth-network
    restart: unless-stopped

  signer2:
    image: ethereum/client-go:v1.13.5
    container_name: eth-signer2
    command:
      - "--datadir=/data"
      - "--networkid=1337"
      - "--port=30303"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=eth,net,web3,personal,admin,txpool,debug"
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - "--mine"
      - "--miner.etherbase=0x529166Fe40a2912d369881D8d5c4E63f75e9e1f8"
      - "--miner.recommit=500ms"
      - "--unlock=0x529166Fe40a2912d369881D8d5c4E63f75e9e1f8"
      - "--password=/data/password.txt"
      - "--allow-insecure-unlock"
      - "--bootnodes=enode://23ce3880ab80f67a7f0fc28769429f713dd72e26a2f63b95b7bcbb6f33c152a463e0069aef8eee5b47ebd716905745d49757e3be24f29a26155945997148151d@signer1:30303"
      - "--verbosity=3"
    volumes:
      - ./signer2:/data
    networks:
      - eth-network
    restart: unless-stopped
    depends_on:
      - signer1

  signer3:
