      - "--bootnodes=enode://23ce3880ab80f67a7f0fc28769429f713dd72e26a2f63b95b7bcbb6f33c152a463e0069aef8eee5b47ebd716905745d49757e3be24f29a26155945997148151d@signer1:30303"
      - "--verbosity=3"
    volumes:
      - ./signer7:/data
    networks:
      - eth-network
    restart: unless-stopped
    depends_on:
      - signer1

  tx-generator:
    build:
      context: ./tx-generator
      dockerfile: Dockerfile
    container_name: eth-tx-generator
    environment:
      - RPC_URL=http://signer1:8545
      - ACCOUNTS_FILE=/data/accounts.json
    volumes:
      - ./setup/accounts.json:/data/accounts.json:ro
    networks:
      - eth-network
    restart: unless-stopped
    depends_on:
      - signer1
      - signer2
      - signer3
      - signer4

networks:
  eth-network:
    driver: bridge