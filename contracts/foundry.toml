[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"  # Latest stable

# Gas optimization
optimizer = true
optimizer_runs = 200  # Balance between deploy cost and runtime cost

# Testing
fuzz_runs = 256  # Number of fuzz test iterations
gas_reports = ["*"]  # Report gas for all contracts

# Remappings (so imports work)
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
local = "http://localhost:8545"  # Your testnet
sepolia = "${SEPOLIA_RPC_URL}"   # For later